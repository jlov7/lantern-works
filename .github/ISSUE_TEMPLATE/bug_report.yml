name: Bug report
description: Describe something that did not work while playing or building.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: |
        Please leave out credentials and private information. Review any replay or diagnostic report before attaching it. For a security issue, use the private route described in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: Include the screen, street and day if relevant. A screenshot is useful.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: Browser version, operating system and approximate screen size.
  - type: input
    id: version
    attributes:
      label: Game version
      description: The rules version on the title screen, plus source version if building locally.
